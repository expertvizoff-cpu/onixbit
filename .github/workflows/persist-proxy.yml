# Transport template only. Not an active workflow in the private source repo.
# The isolated public transport contains exactly this workflow and persist-proxy.py.
name: Synchronise persistent proxy config without service restart

on:
  push:
    branches:
      - plan/onixbit-persist-proxy-20261006
      - maintenance/onixbit-persist-proxy-20261006

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'expertvizoff-cpu/onixbit' && (github.ref == 'refs/heads/plan/onixbit-persist-proxy-20261006' || github.ref == 'refs/heads/maintenance/onixbit-persist-proxy-20261006')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch exact reviewed diagnostic transport
        env:
          TRANSPORT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRANSPORT_SHA" =~ ^[a-f0-9]{40}$ ]]
          git init -q payload
          git -C payload fetch -q --depth 1 https://github.com/expertvizoff-cpu/onixbit.git "$TRANSPORT_SHA"
          git -C payload checkout -q --detach FETCH_HEAD
          test "$(git -C payload rev-parse HEAD)" = "$TRANSPORT_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          paths = subprocess.check_output(['git', '-C', 'payload', 'ls-files', '-z']).decode().split('\0')[:-1]
          assert sorted(paths) == ['.github/workflows/persist-proxy.yml', '.github/workflows/server-maintenance-inventory.yml', 'inventory.py', 'persist-proxy.py']
          assert not Path('payload/persist-proxy.py').is_symlink()
          PY

      - name: Validate or remove the exact authorised obsolete runtime list
        env:
          PHASE_REF: ${{ github.ref_name }}
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/onixbit-site' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$APP_DIR" == /opt/onixbit-site ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ && "$DEPLOY_PORT" -ge 1 && "$DEPLOY_PORT" -le 65535 ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ && "$DEPLOY_HOST" != -* ]]
          test -n "$DEPLOY_KEY"
          key="$RUNNER_TEMP/onixbit-full-site-preflight-key"
          hosts="$RUNNER_TEMP/onixbit-full-site-preflight-hosts"
          trap 'rm -f -- "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          unset DEPLOY_KEY
          chmod 600 "$key"
          # Preserve the existing transport's trust bootstrap. This is not an
          # independently verified host-key pin; no StrictHostKeyChecking=no.
          ssh-keyscan -T 10 -p "$DEPLOY_PORT" "$DEPLOY_HOST" > "$hosts" 2>/dev/null
          test -s "$hosts"
          case "$PHASE_REF" in
            plan/onixbit-persist-proxy-20261006) mode=--plan ;;
            maintenance/onixbit-persist-proxy-20261006) mode=--apply ;;
            *) exit 1 ;;
          esac
          ssh -i "$key" -p "$DEPLOY_PORT" -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o UserKnownHostsFile="$hosts" -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "python3 - $mode" < payload/persist-proxy.py
