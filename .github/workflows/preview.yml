name: Inspect published Onixbit cases preview (read-only)
on:
  push:
    branches: [codex/onixbit-preview-20260920]
permissions: {}
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEPLOY_HOST: ${{ secrets.VPS_HOST }}
      DEPLOY_USER: ${{ secrets.VPS_USER }}
      DEPLOY_PORT: ${{ secrets.VPS_PORT || '22' }}
      DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
      APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/onixbit-site' }}
      PUBLISH_SHA: ${{ github.sha }}
    steps:
      - name: Read current preview and production identities only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$PUBLISH_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APP_DIR" =~ ^/[A-Za-z0-9_./-]+$ && "$APP_DIR" != / && "$APP_DIR" != *'/../'* ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          key="$RUNNER_TEMP/onixbit-inspect-key"
          hosts="$RUNNER_TEMP/onixbit-inspect-hosts"
          trap 'rm -f -- "$key" "$hosts"' EXIT
          git init -q payload
          git -C payload fetch -q --depth 1 https://github.com/expertvizoff-cpu/onixbit.git "$PUBLISH_SHA"
          git -C payload checkout -q FETCH_HEAD
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > "$hosts" 2>/dev/null
          result="$(ssh -i "$key" -p "$DEPLOY_PORT" -o UserKnownHostsFile="$hosts" -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "APP_DIR='$APP_DIR' bash -s" < payload/inspect-cases-preview.sh)"
          printf '%s\n' "$result"
          marker="$(printf '%s\n' "$result" | grep '^ONIXBIT_PREVIEW_STATE=')"
          safe="${marker//'%'/'%25'}"
          safe="${safe//$'\n'/'%0A'}"
          echo "::notice title=Onixbit preview state::$safe"
