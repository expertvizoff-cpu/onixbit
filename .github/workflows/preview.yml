name: Publish reviewed Onixbit design preview
on:
  push:
    branches: [codex/onixbit-preview-20260920]
permissions: {}
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ secrets.VPS_HOST }}
      DEPLOY_USER: ${{ secrets.VPS_USER }}
      DEPLOY_PORT: ${{ secrets.VPS_PORT || '22' }}
      DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
      APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/onixbit-site' }}
      PREVIEW_BUNDLE_KEY: ${{ secrets.ONIXBIT_PREVIEW_BUNDLE_KEY }}
      PUBLISH_SHA: ${{ github.sha }}
    steps:
      - name: Switch only the reviewed design preview
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$PUBLISH_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APP_DIR" =~ ^/[A-Za-z0-9_./-]+$ && "$APP_DIR" != / && "$APP_DIR" != *'/../'* ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          key="$RUNNER_TEMP/onixbit-publish-key"
          hosts="$RUNNER_TEMP/onixbit-publish-hosts"
          bundle="$RUNNER_TEMP/onixbit-preview.tgz"
          encrypted="$RUNNER_TEMP/onixbit-preview.enc"
          trap 'rm -f -- "$key" "$hosts" "$bundle" "$encrypted"' EXIT
          git init -q payload
          git -C payload fetch -q --depth 1 https://github.com/expertvizoff-cpu/onixbit.git "$PUBLISH_SHA"
          git -C payload checkout -q FETCH_HEAD
          cd payload
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          release=json.loads(Path('release.json').read_text())
          assert release['basePath']=='/design'
          assert release['baseReleaseId']=='20260923-company-blocks-0fe140e051'
          assert release['baseBuildId']=='RCwhxPN8qSS0FgAi-SpGT'
          assert re.fullmatch('[a-z0-9-]+',release['releaseId'])
          assert re.fullmatch('[A-Za-z0-9_-]+',release['buildId'])
          for name in ('packageSha','dependencyLockSha','basePackageJsonSha','packageJsonSha','baseProxySha'):
              assert re.fullmatch('[a-f0-9]{64}',release[name])
          rows=Path('bundle.sha256').read_text().splitlines()
          assert rows
          for index,row in enumerate(rows):
              assert re.fullmatch('[a-f0-9]{64}  bundle[.]enc[.]part[0-9]{2}',row)
              assert row.split()[1]==f'bundle.enc.part{index:02}'
          assert sorted(p.name for p in Path('.').glob('bundle.enc.part*'))==[row.split()[1] for row in rows]
          PY
          sha256sum -c bundle.sha256
          while read -r checksum filename; do cat -- "$filename"; done < bundle.sha256 > "$encrypted"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$encrypted" -out "$bundle" -pass env:PREVIEW_BUNDLE_KEY
          readarray -t fields < <(python3 -c 'import json; r=json.load(open("release.json")); print("\n".join(r[k] for k in ["packageSha","releaseId","buildId","dependencyLockSha","packageJsonSha","basePackageJsonSha","baseProxySha","baseReleaseId","baseBuildId"]))')
          package_sha="${fields[0]}"
          release_id="${fields[1]}"
          build_id="${fields[2]}"
          lock_sha="${fields[3]}"
          json_sha="${fields[4]}"
          base_json_sha="${fields[5]}"
          proxy_sha="${fields[6]}"
          base_release="${fields[7]}"
          base_build="${fields[8]}"
          test "$(sha256sum "$bundle" | cut -d' ' -f1)" = "$package_sha"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > "$hosts" 2>/dev/null
          scp -i "$key" -P "$DEPLOY_PORT" -o UserKnownHostsFile="$hosts" -o StrictHostKeyChecking=yes \
            "$bundle" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/onixbit-preview-$release_id.tgz"
          ssh -i "$key" -p "$DEPLOY_PORT" -o UserKnownHostsFile="$hosts" -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR='$APP_DIR' PACKAGE_SHA='$package_sha' RELEASE_ID='$release_id' EXPECTED_BUILD_ID='$build_id' DEPENDENCY_LOCK_SHA='$lock_sha' PACKAGE_JSON_SHA='$json_sha' BASE_PACKAGE_JSON_SHA='$base_json_sha' EXPECTED_PROXY_SHA='$proxy_sha' BASE_RELEASE_ID='$base_release' BASE_BUILD_ID='$base_build' bash -s" < deploy-preview.sh
