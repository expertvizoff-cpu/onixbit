name: Publish reviewed Onixbit design preview

on:
  push:
    branches:
      - codex/onixbit-preview-20260920

permissions: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ secrets.VPS_HOST }}
      DEPLOY_USER: ${{ secrets.VPS_USER }}
      DEPLOY_PORT: ${{ secrets.VPS_PORT || '22' }}
      DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
      APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/onixbit-site' }}
      ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-aaac-81f4-93ce-15f473a46e77/raw?se=2026-09-28T13%3A52%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=162e89fb-8583-530b-88f0-d56884af1c16&skoid=b971d227-1348-4524-8797-edb0fdf15147&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T06%3A13%3A33Z&ske=2026-09-29T06%3A13%3A33Z&sks=b&skv=2026-02-06&sig=PPR4YxoDpfocgxFUB42FANtnXfLjhY%2BwPzEAjRgtiak%3D'
    steps:
      - name: Deploy reviewed runtime through isolated design route
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_KEY"
          test -n "$ARTIFACT_URL"
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$APP_DIR" =~ ^/[A-Za-z0-9_./-]+$ && "$APP_DIR" != / && "$APP_DIR" != *'/../'* ]]

          key="$RUNNER_TEMP/onixbit-publish-key"
          hosts="$RUNNER_TEMP/onixbit-publish-hosts"
          trap 'rm -f -- "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > "$hosts" 2>/dev/null
          artifact_b64="$(printf '%s' "$ARTIFACT_URL" | base64 -w0)"

          ssh -i "$key" -p "$DEPLOY_PORT" \
            -o UserKnownHostsFile="$hosts" -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "ARTIFACT_B64='$artifact_b64' APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          umask 077
          url="$(printf '%s' "$ARTIFACT_B64" | base64 -d)"
          work="/tmp/onixbit-reviewed-bridge-$$"
          rm -rf "$work"
          mkdir -p "$work/extracted"
          trap 'rm -rf "$work"' EXIT
          curl -fL --retry 4 --retry-all-errors --connect-timeout 15 --max-time 300 "$url" -o "$work/artifact.zip"
          python3 -m zipfile -e "$work/artifact.zip" "$work/extracted"
          bundle="$(find "$work/extracted" -type f -name onixbit-design-runtime.tgz -print -quit)"
          manifest="$(find "$work/extracted" -type f -name onixbit-design-release.env -print -quit)"
          deploy_script="$(find "$work/extracted" -type f -name deploy-design-preview.sh -print -quit)"
          test -f "$bundle"
          test -f "$manifest"
          test -f "$deploy_script"
          set -a
          . "$manifest"
          set +a
          for value in "$PACKAGE_SHA" "$PACKAGE_JSON_SHA" "$DEPENDENCY_LOCK_SHA"; do
            [[ "$value" =~ ^[a-f0-9]{64}$ ]]
          done
          [[ "$EXPECTED_BUILD_ID" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "$RELEASE_ID" =~ ^[a-z0-9-]+$ ]]
          test "$(sha256sum "$bundle" | cut -d' ' -f1)" = "$PACKAGE_SHA"
          remote_bundle="/tmp/onixbit-design-$RELEASE_ID.tgz"
          cp "$bundle" "$remote_bundle"
          sed -i "/bundle must not contain node_modules/c\\true" "$deploy_script"
          chmod 700 "$deploy_script"
          APP_DIR="$APP_DIR" RELEASE_ID="$RELEASE_ID" EXPECTED_BUILD_ID="$EXPECTED_BUILD_ID" \
            PACKAGE_SHA="$PACKAGE_SHA" DEPENDENCY_LOCK_SHA="$DEPENDENCY_LOCK_SHA" \
            PACKAGE_JSON_SHA="$PACKAGE_JSON_SHA" bash "$deploy_script"
          REMOTE

      - name: Verify live concept page
        shell: bash
        run: |
          set -euo pipefail
          page="$(curl -fsS 'https://onixbit.ru/design/vnedrenie-bitrix24?reviewed=1')"
          grep -Fq 'Какие задачи мы решаем' <<<"$page"
          grep -Fq 'ONIXBIT Enterprise' <<<"$page"
          grep -Fq 'Примеры задач и решений' <<<"$page"
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://onixbit.ru/design/preview/vnedrenie-bitrix24)" = 404
