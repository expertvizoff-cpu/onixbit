name: Diagnose Onixbit preview routing
on:
  push:
    branches: [codex/onixbit-preview-20260920]
permissions: {}
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_HOST: ${{ secrets.VPS_HOST }}
      DEPLOY_USER: ${{ secrets.VPS_USER }}
      DEPLOY_PORT: ${{ secrets.VPS_PORT || '22' }}
      DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
      APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/onixbit-site' }}
    steps:
      - name: Inspect existing proxy and runtime without changes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/onixbit-key"
          hosts="$RUNNER_TEMP/onixbit-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > "$hosts" 2>/dev/null
          ssh -i "$key" -p "$DEPLOY_PORT" -o UserKnownHostsFile="$hosts" -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          proxy=onixbit-site-caddy-1
          live="$APP_DIR/current/Caddyfile"
          printf 'HOST_CURRENT_CONFIG\n'
          readlink -f "$live"
          stat -c '%d:%i' "$live"
          sha256sum "$live"
          printf 'BOUND_CONTAINER_CONFIG\n'
          docker exec "$proxy" stat -c '%d:%i' /etc/caddy/Caddyfile
          docker exec "$proxy" sha256sum /etc/caddy/Caddyfile
          inode="$(docker exec "$proxy" stat -c '%i' /etc/caddy/Caddyfile)"
          printf 'MATCHING_RELEASE_CONFIG\n'
          find "$APP_DIR/releases" -maxdepth 2 -type f -name Caddyfile -inum "$inode" -print
          printf 'EXPECTED_PUBLIC_HOST\n'
          docker exec "$proxy" sh -c 'if [ "$DOMAIN" = "onixbit.ru" ]; then echo DOMAIN_MATCH=true; else echo DOMAIN_MATCH=false; fi'
          printf 'PREVIEW_CONTAINER_STATE\n'
          docker ps -a --filter name=onixbit-design --format '{{.Names}} {{.Status}}'
          printf 'ROOT_AND_MEDIA_HEALTH\n'
          curl -fsS https://onixbit.ru/api/health
          curl -fsS https://media.onixbit.ru/healthz
          printf '\nPREVIEW_PUBLIC_STATUS\n'
          curl -sS -o /dev/null -w '%{http_code}\n' https://onixbit.ru/design/api/health
          REMOTE
