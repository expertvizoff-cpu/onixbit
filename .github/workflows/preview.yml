name: Inspect Onixbit preview host
on:
  push:
    branches: [codex/onixbit-preview-20260920]
permissions: {}
concurrency:
  group: onixbit-preview
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_HOST: ${{ secrets.VPS_HOST }}
      DEPLOY_USER: ${{ secrets.VPS_USER }}
      DEPLOY_PORT: ${{ secrets.VPS_PORT || '22' }}
      DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
      APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/onixbit-site' }}
    steps:
      - name: Inspect existing proxy and runtime without changes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/onixbit-key"
          hosts="$RUNNER_TEMP/onixbit-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > "$hosts" 2>/dev/null
          ssh -i "$key" -p "$DEPLOY_PORT" -o UserKnownHostsFile="$hosts" -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          printf 'RUNTIME\n'
          docker ps --format '{{.Names}}|{{.Image}}|{{.Ports}}' | grep -E 'onixbit|caddy'
          printf 'CURRENT\n'
          readlink -f "$APP_DIR/current"
          printf 'PROXY_CONFIG_SHA\n'
          sha256sum "$APP_DIR/current/Caddyfile"
          printf 'PROXY_ROUTING\n'
          if grep -Eiq 'token|password|authorization|basic_auth' "$APP_DIR/current/Caddyfile"; then
            echo 'Proxy has private directives; content omitted.'
          else
            cat "$APP_DIR/current/Caddyfile"
          fi
          printf 'PROXY_MOUNTS_AND_NETWORKS\n'
          for container in $(docker ps --format '{{.Names}}' | grep -E 'onixbit.*caddy'); do
            docker inspect --format '{{json .Mounts}} {{json .NetworkSettings.Networks}}' "$container"
          done
          printf 'RESOURCES\n'
          df -h "$APP_DIR"
          free -m | head -n 2
          REMOTE
