name: Publish reviewed Onixbit design preview

on:
  push:
    branches:
      - codex/onixbit-preview-20260920

permissions: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ secrets.VPS_HOST }}
      DEPLOY_USER: ${{ secrets.VPS_USER }}
      DEPLOY_PORT: ${{ secrets.VPS_PORT || '22' }}
      DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
      APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/onixbit-site' }}
      PUBLISH_SHA: ${{ github.sha }}
    steps:
      - name: Publish only the reviewed /design application
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$PUBLISH_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APP_DIR" =~ ^/[A-Za-z0-9_./-]+$ && "$APP_DIR" != / && "$APP_DIR" != *'/../'* ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_KEY"

          key="$RUNNER_TEMP/onixbit-publish-key"
          hosts="$RUNNER_TEMP/onixbit-publish-hosts"
          bundle="$RUNNER_TEMP/onixbit-preview.tgz"
          trap 'rm -f -- "$key" "$hosts" "$bundle"' EXIT

          git init -q payload
          git -C payload fetch -q --depth 1 https://github.com/expertvizoff-cpu/onixbit.git "$PUBLISH_SHA"
          git -C payload checkout -q FETCH_HEAD
          cd payload

          python3 - <<'PY'
          import json, re
          from pathlib import Path

          release = json.loads(Path('release.json').read_text())
          assert release['basePath'] == '/design'
          assert re.fullmatch(r'[a-z0-9-]+', release['releaseId'])
          assert re.fullmatch(r'[A-Za-z0-9_.-]+', release['buildId'])
          for name in ('packageSha', 'dependencyLockSha', 'packageJsonSha'):
              assert re.fullmatch(r'[a-f0-9]{64}', release[name])
          rows = Path('bundle.sha256').read_text().splitlines()
          assert rows
          expected = []
          for index, row in enumerate(rows):
              assert re.fullmatch(r'[a-f0-9]{64}  bundle[.]tgz[.]part[0-9]{2}', row)
              filename = row.split()[1]
              assert filename == f'bundle.tgz.part{index:02}'
              expected.append(filename)
          actual = sorted(path.name for path in Path('.').glob('bundle.tgz.part*'))
          assert actual == expected
          PY

          sha256sum -c bundle.sha256
          while read -r checksum filename; do cat -- "$filename"; done < bundle.sha256 > "$bundle"

          readarray -t fields < <(python3 -c 'import json; r=json.load(open("release.json")); print("\n".join(r[k] for k in ["packageSha","releaseId","buildId","dependencyLockSha","packageJsonSha"]))')
          package_sha="${fields[0]}"
          release_id="${fields[1]}"
          build_id="${fields[2]}"
          lock_sha="${fields[3]}"
          json_sha="${fields[4]}"
          test "$(sha256sum "$bundle" | cut -d' ' -f1)" = "$package_sha"

          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > "$hosts" 2>/dev/null
          scp -i "$key" -P "$DEPLOY_PORT" -o UserKnownHostsFile="$hosts" -o StrictHostKeyChecking=yes \
            "$bundle" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/onixbit-preview-$release_id.tgz"
          ssh -i "$key" -p "$DEPLOY_PORT" -o UserKnownHostsFile="$hosts" -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR='$APP_DIR' PACKAGE_SHA='$package_sha' RELEASE_ID='$release_id' EXPECTED_BUILD_ID='$build_id' DEPENDENCY_LOCK_SHA='$lock_sha' PACKAGE_JSON_SHA='$json_sha' bash -s" < deploy-preview.sh
