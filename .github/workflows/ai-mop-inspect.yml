name: Inspect isolated ai-mop staging target
on:
  push:
    branches: [stage/ai-mop-inspect-20261030-a]
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'expertvizoff-cpu/onixbit' && github.ref == 'refs/heads/stage/ai-mop-inspect-20261030-a'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact two-file inspection source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git init -q payload
          git -C payload fetch -q --depth 1 https://github.com/expertvizoff-cpu/onixbit.git "$SOURCE_SHA"
          git -C payload checkout -q --detach FETCH_HEAD
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          files=subprocess.check_output(['git','-C','payload','ls-files','-z']).decode().split('\0')[:-1]
          assert sorted(files)==['.github/workflows/ai-mop-inspect.yml','inspect_host.py']
          assert all(not (Path('payload')/name).is_symlink() for name in files)
          PY
      - name: Read host inventory without changing services
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$DEPLOY_HOST" == 213.159.208.219 && "$DEPLOY_USER" == deploy && "$DEPLOY_PORT" == 22 ]]
          key="$RUNNER_TEMP/ai-mop-inspect-key"
          hosts="$RUNNER_TEMP/ai-mop-inspect-hosts"
          trap 'rm -f -- "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          unset DEPLOY_KEY
          printf '%s\n' '213.159.208.219 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOipEWxmeTKFpmxeyiVhnD5XYPr+O9YUJXobStBB12BN' > "$hosts"
          ssh -i "$key" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o UserKnownHostsFile="$hosts" -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'python3 -B -' < payload/inspect_host.py
