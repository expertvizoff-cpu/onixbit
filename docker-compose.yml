services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_YANDEX_METRIKA_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_ID:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    image: onixbit-site:${ONIXBIT_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      BITRIX24_WEBHOOK_URL: ${BITRIX24_WEBHOOK_URL:-}
      BITRIX24_ALLOWED_HOST: ${BITRIX24_ALLOWED_HOST:-}
      BITRIX24_SOURCE_ID: ${BITRIX24_SOURCE_ID:-WEBFORM}
      BITRIX24_DEAL_CATEGORY_ID: ${BITRIX24_DEAL_CATEGORY_ID:-}
      BITRIX24_DEAL_STAGE_ID: ${BITRIX24_DEAL_STAGE_ID:-}
      BITRIX24_ASSIGNED_BY_ID: ${BITRIX24_ASSIGNED_BY_ID:-}
      LEAD_ALLOWED_ORIGINS: ${LEAD_ALLOWED_ORIGINS:-https://onixbit.ru}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 25s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-expert@onixbit.ru}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
